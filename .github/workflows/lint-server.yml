name: Lint & Format (server)

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check . --ignore-path ../.prettierignore
        