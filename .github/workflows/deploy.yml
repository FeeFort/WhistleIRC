name: Build & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - workflows

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-latest, platform: macos }
          - { os: windows-latest, platform: windows }

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Check server/package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG="$(node -p "require('./server/package.json').version")"
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "Release tag $TAG does not match server/package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Build client
        run: npm run build --prefix client

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        run: |
          curl -fL -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build server
        working-directory: server
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run build:debug -- --platform=${{ matrix.platform }} --skip-client

      - name: Upload artifacts
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: server/build/*
          fail_on_unmatched_files: true
